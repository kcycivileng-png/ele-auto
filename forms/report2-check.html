<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f6e4f" />
<title>電廠檢修報告</title>
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../icons/icon-192.png" />
<link rel="apple-touch-icon" href="../icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<header class="app-header">
  <button type="button" class="back-btn" id="headerBackBtn">‹</button>
  <div>
    <h1>電廠檢修報告</h1>
    <div class="subtitle" id="headerSubtitle">附表二・異常發生時填寫</div>
  </div>
</header>

<main>
  <!-- ================= 紀錄列表畫面 ================= -->
  <section id="recordsListView">
    <button type="button" class="csv-export-all-btn" id="exportAllCsvBtn">
      📊 匯出全部紀錄 CSV<span class="csv-count" id="csvCount"></span>
    </button>
    <button type="button" class="new-record-btn" id="newRecordBtn">＋ 新增一筆</button>

    <div class="records-toolbar">
      <select id="sortSelect">
        <option value="updated_desc">更新時間：新→舊</option>
        <option value="updated_asc">更新時間：舊→新</option>
        <option value="plant_asc">電廠名稱：A→Z</option>
      </select>
      <input type="text" id="filterInput" placeholder="搜尋電廠名稱…" />
    </div>

    <button type="button" class="select-mode-btn" id="selectModeBtn">☑ 選取多筆（一鍵匯出／刪除）</button>
    <div class="select-toolbar" id="selectToolbar" hidden>
      <button type="button" class="small-btn" id="selectAllRecordsBtn">全選</button>
      <button type="button" class="small-btn" id="selectNoneRecordsBtn">取消全選</button>
      <span class="select-count" id="selectCount">已選 0 筆</span>
    </div>

    <div id="recordsList"></div>
    <div class="empty-state" id="emptyState" hidden>尚未有任何紀錄，點上方「＋ 新增一筆」開始填寫。</div>

    <footer class="page-footer">紀錄與簽名僅儲存在本機裝置，不會上傳至任何伺服器。<br />版本 <span id="appVersion"></span></footer>
  </section>

  <!-- ================= 表單編輯畫面 ================= -->
  <section id="formEditorView" hidden>
    <section class="section-card">
      <h2><span class="num">1</span>基本資料</h2>
      <div class="field">
        <label class="field-label">電廠持有者</label>
        <select id="f-holder" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;">
          <option value="">請選擇電廠持有者</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">電廠名稱</label>
        <div style="display:flex;gap:8px;">
          <select id="f-plantGroup" style="flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;">
            <option value="">請選擇群組</option>
          </select>
          <select id="f-plantSite" style="flex:1.4;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;" disabled>
            <option value="">請先選群組</option>
          </select>
        </div>
      </div>
    </section>

    <section class="section-card">
      <h2><span class="num">2</span>障礙來源</h2>
      <div class="hint" style="margin-bottom:10px;">可複選</div>
      <div id="sourceWrap" class="checkbox-grid"></div>
    </section>

    <section class="section-card">
      <h2><span class="num">3</span>時間與說明</h2>
      <div class="field">
        <label class="field-label">告修時間</label>
        <input type="datetime-local" id="f-reportTime" />
      </div>
      <div class="field">
        <label class="field-label">完成時間</label>
        <input type="datetime-local" id="f-completeTime" />
      </div>
      <div class="field">
        <label class="field-label">障礙說明</label>
        <textarea id="f-issueDesc" placeholder="請描述障礙狀況…"></textarea>
      </div>
    </section>

    <section class="section-card">
      <h2><span class="num">4</span>完工總結</h2>
      <div class="field">
        <label class="field-label">障礙原因</label>
        <textarea id="f-cause"></textarea>
      </div>
      <div class="field">
        <label class="field-label">障礙影響範圍</label>
        <textarea id="f-impact"></textarea>
      </div>
      <div class="field">
        <label class="field-label">障礙解決方式</label>
        <textarea id="f-solution"></textarea>
      </div>
    </section>

    <section class="section-card">
      <h2><span class="num">5</span>是否結案</h2>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px;">
          <input type="radio" name="closed" value="是" id="f-closedYes" style="width:18px;height:18px;" /> 是
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;">
          <input type="radio" name="closed" value="否" id="f-closedNo" style="width:18px;height:18px;" /> 否
        </label>
      </div>
      <div class="field" id="closeTimeField" hidden>
        <label class="field-label">結案時間</label>
        <input type="datetime-local" id="f-closeTime" />
      </div>
      <div class="field" id="followUpField" hidden>
        <label class="field-label">追蹤事項</label>
        <textarea id="f-followUp"></textarea>
      </div>
    </section>

    <section class="section-card">
      <h2><span class="num">6</span>簽核</h2>
      <div class="field">
        <label class="field-label">現場負責工程師</label>
        <div id="sigEngineerWrap"></div>
      </div>
      <div class="field">
        <label class="field-label">維運主管</label>
        <div id="sigSupervisorWrap"></div>
      </div>
    </section>

    <div class="draft-status" id="draftStatus">尚未儲存</div>
    <footer class="page-footer">草稿與簽名僅儲存在本機裝置，不會上傳至任何伺服器。</footer>
  </section>
</main>

<div class="action-bar" id="editorActionBar" hidden>
  <button type="button" class="btn btn-secondary" id="saveDraftBtn">💾 儲存草稿</button>
  <button type="button" class="btn btn-primary" id="exportPdfBtn">📄 匯出 PDF</button>
  <button type="button" class="btn btn-secondary" id="uploadCloudBtn">☁️ 上傳雲端</button>
</div>

<div class="action-bar" id="bulkActionBar" hidden>
  <button type="button" class="btn btn-secondary" id="bulkDeleteBtn">🗑 刪除選取</button>
  <button type="button" class="btn btn-primary" id="bulkExportBtn">📄 匯出選取PDF</button>
  <button type="button" class="btn" id="exitSelectModeBtn" style="flex:0 0 100%;background:none;color:var(--ink-400);font-weight:400;padding:4px;">取消選取</button>
</div>

<div class="toast" id="toast" hidden></div>

<div class="modal-backdrop" id="missingFieldsModal" hidden>
  <div class="modal-sheet">
    <h3>還有欄位未完成</h3>
    <p class="hint">請先完成以下項目才能匯出 PDF：</p>
    <ul id="missingFieldsList" style="margin:0 0 16px;padding-left:20px;font-size:13.5px;line-height:1.9;color:#c0392b;"></ul>
    <button type="button" class="small-btn" style="width:100%;text-align:center;" id="closeMissingModalBtn">我知道了</button>
  </div>
</div>

<script src="../vendor/jspdf.umd.min.js"></script>
<script src="../vendor/html2canvas.min.js"></script>
<script src="../js/db.js"></script>
<script src="../js/bulk-select.js"></script>
<script src="../js/drive-upload.js"></script>
<script src="../js/signature.js"></script>
<script src="../js/pdf-export.js"></script>
<script src="../js/csv-export.js"></script>
<script src="../js/share.js"></script>
<script src="../js/app.js"></script>
<script src="../js/forms/report2-check-template.js"></script>
<script src="../js/forms/report2-check.js"></script>
<script>
  fetch('../service-worker.js').then((r) => r.text()).then((t) => {
    const m = t.match(/CACHE_VERSION\s*=\s*'([^']+)'/);
    const el = document.getElementById('appVersion');
    if (el) el.textContent = m ? m[1] : '未知';
  }).catch(() => {});
</script>
</body>
</html>
