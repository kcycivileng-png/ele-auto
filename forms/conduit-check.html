<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f6e4f" />
<title>線槽/管線檢查表</title>
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../icons/icon-192.png" />
<link rel="apple-touch-icon" href="../icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<header class="app-header">
  <button type="button" class="back-btn" id="headerBackBtn">‹</button>
  <div>
    <h1>線槽/管線檢查表</h1>
    <div class="subtitle" id="headerSubtitle">附表一・維運報告 子檢查表</div>
  </div>
</header>

<main>
  <!-- ================= 紀錄列表畫面 ================= -->
  <section id="recordsListView">
    <button type="button" class="csv-export-all-btn" id="exportAllCsvBtn">
      📊 匯出全部紀錄 CSV<span class="csv-count" id="csvCount"></span>
    </button>
    <button type="button" class="new-record-btn" id="newRecordBtn">＋ 新增一筆</button>

    <div class="records-toolbar">
      <select id="sortSelect">
        <option value="updated_desc">更新時間：新→舊</option>
        <option value="updated_asc">更新時間：舊→新</option>
        <option value="date_desc">檢查日期：新→舊</option>
        <option value="date_asc">檢查日期：舊→新</option>
        <option value="plant_asc">電廠名稱：A→Z</option>
      </select>
      <input type="text" id="filterInput" placeholder="搜尋電廠名稱或檢查人員…" />
    </div>

    <button type="button" class="select-mode-btn" id="selectModeBtn">☑ 選取多筆（一鍵匯出／刪除）</button>
    <div class="select-toolbar" id="selectToolbar" hidden>
      <button type="button" class="small-btn" id="selectAllRecordsBtn">全選</button>
      <button type="button" class="small-btn" id="selectNoneRecordsBtn">取消全選</button>
      <span class="select-count" id="selectCount">已選 0 筆</span>
    </div>

    <div id="recordsList"></div>
    <div class="empty-state" id="emptyState" hidden>尚未有任何紀錄，點上方「＋ 新增一筆」開始填寫。</div>

    <footer class="page-footer">紀錄與照片僅儲存在本機裝置，不會上傳至任何伺服器。<br />版本 <span id="appVersion"></span></footer>
  </section>

  <!-- ================= 表單編輯畫面 ================= -->
  <section id="formEditorView" hidden>
    <section class="section-card">
      <h2><span class="num">1</span>基本資料</h2>
      <div class="field">
        <label class="field-label">電廠名稱</label>
        <div style="display:flex;gap:8px;">
          <select id="f-plantGroup" style="flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;">
            <option value="">請選擇群組</option>
          </select>
          <select id="f-plantSite" style="flex:1.4;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;" disabled>
            <option value="">請先選群組</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">檢查日期</label>
        <input type="date" id="f-checkDate" />
      </div>
      <div class="field">
        <label class="field-label">檢查人員</label>
        <input type="text" id="f-inspector" placeholder="請輸入檢查人員姓名" />
      </div>
    </section>

    <section class="section-card">
      <h2><span class="num">2</span>線槽/管線檢查項目（每季）</h2>
      <div id="checklistWrap"></div>
    </section>

    <section class="section-card">
      <h2><span class="num">3</span>相片</h2>
      <div id="photoWrap"></div>
    </section>

    <section class="section-card">
      <h2><span class="num">4</span>檢修說明</h2>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;">
          <input type="checkbox" id="f-noIssue" style="width:18px;height:18px;" /> 無異常
        </label>
      </div>
      <div class="field" id="repairNoteField">
        <label class="field-label">說明內容</label>
        <textarea id="f-repairNote" placeholder="請描述檢修內容、原因與處理方式…"></textarea>
      </div>
    </section>

    <div class="draft-status" id="draftStatus">尚未儲存</div>
    <footer class="page-footer">草稿與照片僅儲存在本機裝置，不會上傳至任何伺服器。</footer>
  </section>
</main>

<div class="action-bar" id="editorActionBar" hidden>
  <button type="button" class="btn btn-secondary" id="saveDraftBtn">💾 儲存草稿</button>
  <button type="button" class="btn btn-primary" id="exportPdfBtn">📄 匯出 PDF</button>
  <button type="button" class="btn btn-secondary" id="uploadCloudBtn">☁️ 上傳雲端</button>
</div>

<div class="action-bar" id="bulkActionBar" hidden>
  <button type="button" class="btn btn-secondary" id="bulkDeleteBtn">🗑 刪除選取</button>
  <button type="button" class="btn btn-primary" id="bulkExportBtn">📄 匯出選取PDF</button>
  <button type="button" class="btn" id="exitSelectModeBtn" style="flex:0 0 100%;background:none;color:var(--ink-400);font-weight:400;padding:4px;">取消選取</button>
</div>

<div class="toast" id="toast" hidden></div>

<div class="modal-backdrop" id="missingFieldsModal" hidden>
  <div class="modal-sheet">
    <h3>還有欄位未完成</h3>
    <p class="hint">請先完成以下項目才能匯出 PDF：</p>
    <ul id="missingFieldsList" style="margin:0 0 16px;padding-left:20px;font-size:13.5px;line-height:1.9;color:#c0392b;"></ul>
    <button type="button" class="small-btn" style="width:100%;text-align:center;" id="closeMissingModalBtn">我知道了</button>
  </div>
</div>

<script src="../vendor/jspdf.umd.min.js"></script>
<script src="../vendor/html2canvas.min.js"></script>
<script src="../js/db.js"></script>
<script src="../js/bulk-select.js"></script>
<script src="../js/drive-upload.js"></script>
<script src="../js/photo.js"></script>
<script src="../js/form-kit.js"></script>
<script src="../js/pdf-export.js"></script>
<script src="../js/csv-export.js"></script>
<script src="../js/share.js"></script>
<script src="../js/app.js"></script>
<script src="../js/forms/conduit-check-template.js"></script>
<script src="../js/forms/conduit-check.js"></script>
<script>
  fetch('../service-worker.js').then((r) => r.text()).then((t) => {
    const m = t.match(/CACHE_VERSION\s*=\s*'([^']+)'/);
    const el = document.getElementById('appVersion');
    if (el) el.textContent = m ? m[1] : '未知';
  }).catch(() => {});
</script>
</body>
</html>
